[project]
name = "incident-agent"
version = "1.0.0"
description = "A Claude Code agent that investigates production incidents using logs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30.0,<2",
]

[project.scripts]
generate-data = "incident_agent.data.cli:main"
incident-logs-server = "incident_agent.mcp_server:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
